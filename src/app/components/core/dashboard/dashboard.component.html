<div class="dashboard">
  <div class="dashboard__header">
    <h1 class="dashboard__title">Search it on giphy</h1>
    <p class="dashboard__subtitle">Search for your favorite gifs! Insert a keyword and press search to start.</p>
  </div>
  <app-search-bar (onSearch)="search($event)" (onSort)="sortCards($event)"></app-search-bar>
  <div
    infiniteScroll
    [infiniteScrollDistance]="1"
    (scrolled)="onScrolled()"
    [scrollWindow]="true"
    [alwaysCallback]="false"
    class="dashboard__grid"
  >
    @if(this.gifsDataResponse.length === 0){
      <div class="dashboard__no-data">No data found</div>
    }
    @for(gifObject of gifsDataResponse; track gifObject){
      <app-gif-card [gifObject]="gifObject" [from]="'dashboard'" (click)="onCardClicked(gifObject)"/>
    }
  </div>
</div>
