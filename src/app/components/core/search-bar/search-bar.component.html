<div class="searchbar__search-row justify-content-between">
  <form [formGroup]="searchForm" (ngSubmit)="onSearchSubmit()">
    <mat-form-field class="searchbar__search-field h-50">
      <input matInput placeholder="Search..." formControlName="searchQuery">
    </mat-form-field>
    <!-- <button mat-raised-button color="primary" class="searchbar__search-button ms-2" type="submit">
      <mat-icon class="searchbar__search-button__icon">search</mat-icon>
    </button> -->
    <button mat-raised-button color="primary" class="searchbar__search-button ms-2" type="submit">
      <mat-icon class="searchbar__search-button__icon">search</mat-icon>
    </button>
  </form>
  <mat-form-field class="searchbar__sort-field ms-4">
    <mat-select placeholder="Sort by" (selectionChange)="onSortOrderChange($event.value)">
      <mat-option value="asc">Date Ascending</mat-option>
      <mat-option value="desc">Date Descending</mat-option>
    </mat-select>
  </mat-form-field>
</div>
