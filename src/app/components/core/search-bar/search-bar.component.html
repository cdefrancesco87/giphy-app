<div class="searchbar__search-row">
  <form [formGroup]="searchForm" (ngSubmit)="onSearchSubmit()">
    <mat-form-field class="searchbar__input-field">
      <input
        matInput placeholder="Enter text" aria-label="Enter text"
        formControlName="searchQuery"
      >
      <button mat-icon-button matRippleDisabled matSuffix class="me-3" type="submit">
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
  </form>

  <mat-form-field class="searchbar__sort-field ms-4">
    <mat-select placeholder="Sort by" (selectionChange)="onSortOrderChange($event.value)">
      <mat-option value="asc">Date Ascending</mat-option>
      <mat-option value="desc">Date Descending</mat-option>
    </mat-select>
  </mat-form-field>
</div>
