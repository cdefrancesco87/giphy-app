<app-header
  [title]="'Favorite gifs'"
  [subtitle]="'Here you can findo your favorite gifs! Press on trash bin icon to remove them.'"
/>

@if(this.favorites.length === 0){
  <div class="text-center align-middle mt-5">
    <p class="dashboard__no-data">No data found; go search some gifs to add to your favorite collection!</p>
    <button type="button" class="btn btn-primary mt-2" (click)="redirectToHome()">Go to Home</button>
  </div>
}
<div class="dashboard__grid">
  @for(item of favorites; track item){
    <app-gif-card [gifObject]="item" (click)="onCardClick(item)"/>
  }
</div>
