<div class="dashboard">
  <div class="dashboard__header">
    <h1 class="dashboard__title">Favorite gifs</h1>
    <p class="dashboard__subtitle">Here you can findo your favorite gifs! press on trashbin icon to remove them.</p>
  </div>
  <div class="dashboard__grid"
  >
    @for(item of favorites; track item){
      <app-gif-card [gifObject]="item" (click)="onCardClick(item)"/>
    }
  </div>
</div>
