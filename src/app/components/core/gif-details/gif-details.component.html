<app-header [title]="'Gif ' + gifObject.title + ' details'"></app-header>
<div>
  <button class="custom-button">
    <img
      [src]="giphyLogoUrl"
      alt="gihpy-logo-branding"
      class="custom-button-img">
  </button>
</div>
<div class="container py-5">
  <div class="row align-middle">
    <div class="col-12 col-md-6 text-center">
      @if(gifObject.images){
        @if(isLoading){
          <div class="loader-container" [style.height.px]="imageHeight" [style.width.px]="imageWidth">
            <mat-spinner></mat-spinner>
          </div>
        }
        <img
          [src]="imageSrc"
          alt="{{ altText }}"
          [hidden]="isLoading"
          class="gif-card_image"
          (load)="onLoad()"
          (error)="onError()"
        >
      } @else {
        <p class="dashboard__no-data">No data found; try to search some new gifs to add to your favorite collection!</p>
      }
    </div>
    <div class="col-12 col-md-6">
      <h2>{{ gifObject.title }}</h2>
      <p>Author: {{ gifObject.username || 'Unknown' }}</p>
      <p>Rating: {{ gifObject.rating }}</p>
      <p>Source: <a [href]="gifObject.source" target="_blank">{{ gifObject.source }}</a></p>
    </div>
    <div class="col-12 col-md-2"></div>
  </div>
</div>
