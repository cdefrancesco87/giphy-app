<div class="dashboard__search-row">
  <form [formGroup]="searchForm" (ngSubmit)="onSearchSubmit()">
    <mat-form-field class="dashboard__search-field h-50">
      <input matInput placeholder="Search..." formControlName="searchQuery">
    </mat-form-field>
    <button mat-raised-button color="primary" class="dashboard__search-button ms-3" type="submit">
      Search
    </button>
  </form>
</div>
