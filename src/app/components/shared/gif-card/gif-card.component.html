<div class="gif-card">
  @if(isLoading){
    <div class="loader-container" [style.height.px]="imageHeight" [style.width.px]="imageWidth">
      <mat-spinner></mat-spinner>
    </div>

  }
  <div class="image-container position-relative">
    <img
      [src]="imageSrc"
      alt="{{ altText }}"
      [hidden]="isLoading"
      class="gif-card_image"
      (load)="onLoad()"
      (error)="onError()"
      (click)="openGifDetails()"
    >
    <div class="gif-card__footer position-absolute">
      @if(from === 'dashboard') {
        <div class="gif-card__favorite-button d-fex">
          <mat-icon
            class="gif-card__favorite-button__icon"
            (click)="toggleFavorite()"
          > {{ isFavorite ? 'favorite' : 'favorite_border' }} </mat-icon>
        </div>
      }
      @if (from === 'favorites'){
        <div class="gif-card__favorite-button d-fex">
          <mat-icon
            class="gif-card__favorite-button__icon"
            (click)="toggleFavorite()"
          > {{ 'delete' }} </mat-icon>
        </div>
      }
    </div>
  </div>
</div>
