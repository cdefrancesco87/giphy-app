<div class="gif-card">
  @if(isLoading){
    <div class="loader-container" [style.height.px]="imageHeight" [style.width.px]="imageWidth">
      <mat-spinner></mat-spinner>
    </div>

  }
  <div class="image-container" style="position: relative;">
    <img
      [src]="imageSrc"
      alt="{{ altText }}"
      [hidden]="isLoading"
      (load)="onLoad()"
      (error)="onError()"
    >
    <div class="gif-card__footer" style="position: absolute; bottom: 5px; right: 5\px;">
      @if(from === 'dashboard') {
        <button class="favorite-button" (click)="toggleFavorite()">
          <mat-icon>{{ isFavorite ? 'favorite' : 'favorite_border' }}</mat-icon>
        </button>
      }
      @if (from === 'favorites'){
        <button class="favorite-button" (click)="toggleFavorite()">
          <mat-icon>{{ 'delete' }}</mat-icon>
        </button>
      }
    </div>
  </div>
</div>
