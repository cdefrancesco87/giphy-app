<div class="dashboard">
  <div class="dashboard__header">
    <h1 class="dashboard__title">Dashboard Title</h1>
  </div>
  <div class="dashboard__search-row">
    <mat-form-field class="dashboard__search-field">
      <input matInput placeholder="Search...">
    </mat-form-field>
    <button mat-raised-button color="primary" class="dashboard__search-button">Search</button>
  </div>
  <div class="dashboard__grid">
    <!-- Grid items go here -->
    <mat-grid-list cols="3" rowHeight="2:1">
      <mat-grid-tile>Item 1</mat-grid-tile>
      <mat-grid-tile>Item 2</mat-grid-tile>
      <mat-grid-tile>Item 3</mat-grid-tile>
      <!-- Add more items as needed -->
    </mat-grid-list>
  </div>
</div>
