<div class="dashboard">
  <div class="dashboard__header">
    <h1 class="dashboard__title">Dashboard Title</h1>
  </div>
  <app-search-bar (onSearch)="search($event)"></app-search-bar>
  <div
    infiniteScroll
    [infiniteScrollDistance]="1"
    (scrolled)="onScrolled()"
    [scrollWindow]="true"
    [alwaysCallback]="false"
    class="dashboard__grid"
  >
    <div class="position-relative w-100% mx-2">
      <section *ngFor="let item of gifsDataResponse">
        <a [href]="item.content_url" target="_blank" rel="noopener noreferrer">
          <picture>
            <source
              type="image/webp"
              srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
            />
            <img
              [src]="item.images.preview_webp.url"
              width="100%"
              height="100%"
              alt="{{item.alt_text}}"
            />
          </picture>
        </a>
      </section>
    </div>

</div>
